{% extends 'base.html' %}
{% block content %}
<div class="page-header"><h1>{{ 'Edit Member' if member else 'Add Member' }}</h1></div>

<form method="post">
  <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">

  <div class="card">
    <h2 class="section-title">Personal Information</h2>
    <div class="form-grid">
      <div><label>Full Name (English)</label><input name="full_name_en" required value="{{ member.full_name_en if member else '' }}"></div>
      <div><label>Full Name (Arabic)</label><input name="full_name_ar" value="{{ member.full_name_ar if member else '' }}"></div>
      <div><label>Phone</label><input name="phone" value="{{ member.phone if member else '' }}"></div>
      <div><label>Email</label><input type="email" name="email" value="{{ member.email if member else '' }}"></div>
      <div><label>Birth Date</label><input type="date" name="birth_date" value="{{ member.birth_date if member else '' }}"></div>
      <div><label>Gender</label><input name="gender" value="{{ member.gender if member else '' }}"></div>
      <div><label>City / Area</label><input name="city" value="{{ member.city if member else '' }}"></div>
      <div><label>Current Status</label><input name="current_status" value="{{ member.current_status if member else '' }}"></div>
    </div>
  </div>

  <div class="card">
    <h2 class="section-title">Education &amp; Work</h2>
    <div class="form-grid">
      <div><label>Studied Where / University</label><input name="studied_where" value="{{ member.studied_where if member else '' }}"></div>
      <div><label>Field of Study</label><input name="field_of_study" value="{{ member.field_of_study if member else '' }}"></div>
      <div><label>Work</label><input name="work" value="{{ member.work if member else '' }}"></div>
      <div><label>English Level</label><input name="english_level" value="{{ member.english_level if member else '' }}"></div>
    </div>
  </div>

  <div class="card">
    <h2 class="section-title">Sawa Journey</h2>
    <div class="form-grid">
      <div><label>Date of Joining</label><input type="date" name="date_joined" value="{{ member.date_joined if member else '' }}"></div>
      <div class="full"><label>Motivation for Joining Sawa</label><textarea name="motivation">{{ member.motivation if member else '' }}</textarea></div>
      <div class="full"><label>Skills</label><textarea name="skills" placeholder="Example: Graphic design, public speaking">{{ member.skills if member else '' }}</textarea></div>
      <div class="full"><label>Interests</label><textarea name="interests">{{ member.interests if member else '' }}</textarea></div>
      <div class="full"><label>What Would They Like to Learn More?</label><textarea name="learn_more">{{ member.learn_more if member else '' }}</textarea></div>
      <div class="full"><label>Notes</label><textarea name="notes">{{ member.notes if member else '' }}</textarea></div>
    </div>
  </div>

  <div class="card">
    <h2 class="section-title">Safety &amp; Emergency Contact</h2>
    <div class="form-grid">
      <div><label>Blood Type</label><input name="blood_type" placeholder="Example: O+" value="{{ member.blood_type if member else '' }}"></div>
      <div>
        <label>Access to Transportation</label>
        <select name="has_transportation">
          <option value="" {% if not member or not member.has_transportation %}selected{% endif %}>Not specified</option>
          <option value="Yes" {% if member and member.has_transportation == 'Yes' %}selected{% endif %}>Yes</option>
          <option value="No" {% if member and member.has_transportation == 'No' %}selected{% endif %}>No</option>
        </select>
      </div>
      <div><label>Emergency Contact Name</label><input name="emergency_contact_name" value="{{ member.emergency_contact_name if member else '' }}"></div>
      <div><label>Emergency Contact Phone</label><input name="emergency_contact_phone" value="{{ member.emergency_contact_phone if member else '' }}"></div>
    </div>
  </div>

  <div class="card">
    <h2 class="section-title">Events &amp; Sessions</h2>
    <div class="form-grid">
      <div class="full">
        <label>Events Attended</label>
        <div class="checkbox-list">
          {% for e in events %}<label><input type="checkbox" name="events" value="{{ e.id }}" {% if e.id|string in selected_events %}checked{% endif %}> {{ e.name }}</label>{% endfor %}
        </div>
      </div>
      <div class="full">
        <label>AI Workshop Sessions Attended</label>
        <div class="checkbox-list">
          {% for s in sessions %}<label><input type="checkbox" name="sessions" value="{{ s.id }}" {% if s.id|string in selected_sessions %}checked{% endif %}> {{ s.name }} — {{ s.session_date }}</label>{% endfor %}
        </div>
      </div>
    </div>
  </div>

  <div class="form-actions">
    <button class="btn">Save</button>
    <a class="btn secondary" href="{{ url_for('members') }}">Cancel</a>
  </div>
</form>
{% endblock %}
